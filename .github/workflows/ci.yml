name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  packages:
    name: Build and installed wheel / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check the shell installer syntax
        run: bash -n tools/install.sh
      - name: Check the release inventory regressions
        run: |
          python -m unittest discover -s tests -p test_release_assets.py -v
          python -m unittest discover -s tests -p test_google_installation.py -v
          python -m unittest discover -s tests -p test_upgrade_smoke.py -v
      - name: Check the packaged bilingual reader
        run: |
          python -m pip install markdown-it-py==4.0.0
          python -m unittest discover -s docs/presentation/tests -p test_reader.py -v
      - name: Build packages and release assets
        run: |
          python -m pip install build
          python tools/build_release.py --output dist
      - name: Exercise the installed wheel outside the checkout
        shell: bash
        run: |
          FLOWER_EXPECTED_VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          export FLOWER_EXPECTED_VERSION
          python -m venv "$RUNNER_TEMP/flower-wheel"
          "$RUNNER_TEMP/flower-wheel/bin/python" -m pip install dist/flow_of_work_mcp-*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/flower-mcp" --help
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -c 'from importlib.metadata import version; from importlib.resources import files; import flow_of_work_mcp; import os; from pathlib import Path; assert Path(flow_of_work_mcp.__file__).is_relative_to(Path("flower-wheel").resolve()); assert files("flow_of_work_mcp").joinpath("resources/standalone.yaml").is_file(); installed = version("flow-of-work-mcp"); assert installed == os.environ["FLOWER_EXPECTED_VERSION"], f"Installed version differs: {installed}"; print(installed)'
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -c 'from importlib.util import find_spec; assert find_spec("runtime_llama") is None; assert find_spec("lmstudio_agent_runtime") is None'
          "$RUNNER_TEMP/flower-wheel/bin/python" -m pip install 'pytest>=8,<10' markdown-it-py==4.0.0
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_installation_identity_and_probe.py" "$GITHUB_WORKSPACE/tests/test_server_signal_cleanup.py" "$GITHUB_WORKSPACE/tests/test_mcp_probe_transport.py" "$GITHUB_WORKSPACE/tests/test_safe_upgrade.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_architecture_authority.py" "$GITHUB_WORKSPACE/tests/test_architecture_effect_receipts.py" "$GITHUB_WORKSPACE/tests/test_architecture_rejection_audit.py" "$GITHUB_WORKSPACE/tests/test_architecture_packet_refs.py" "$GITHUB_WORKSPACE/tests/test_noxi_architecture_handoff.py" "$GITHUB_WORKSPACE/tests/test_packet_executor.py" "$GITHUB_WORKSPACE/tests/test_provider_validation_delivery.py" "$GITHUB_WORKSPACE/tests/test_noxi_public_contracts.py" "$GITHUB_WORKSPACE/tests/test_noxi_migrations.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_srs_rejection_diagnostics.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_pvp_capability_discovery.py" "$GITHUB_WORKSPACE/tests/test_pvp_temporal_authoring.py" "$GITHUB_WORKSPACE/tests/test_packet_provider_port.py" "$GITHUB_WORKSPACE/tests/test_test_provider_port.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_author_receipts.py" "$GITHUB_WORKSPACE/tests/test_external_work_recovery.py" "$GITHUB_WORKSPACE/tests/test_flower_portability.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_provider_sync_only.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_tool_definitions.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_lens_operation_catalog.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_readable_lifecycle_markdown.py" "$GITHUB_WORKSPACE/tests/test_readable_roadmap.py" "$GITHUB_WORKSPACE/tests/test_guided_bootstrap.py" "$GITHUB_WORKSPACE/tests/test_guided_operational_projection.py" "$GITHUB_WORKSPACE/tests/test_artifact_generation.py" "$GITHUB_WORKSPACE/tests/test_external_plan_markdown.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_snapshot_read_cost.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_mcp_provider_deadline.py" "$GITHUB_WORKSPACE/tests/test_packet_provider_deadline.py" "$GITHUB_WORKSPACE/tests/test_mfpr_structured_provider.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_milestone_prerequisites.py" "$GITHUB_WORKSPACE/tests/test_milestone_effect_receipts.py" "$GITHUB_WORKSPACE/tests/test_packet_start_effect_receipts.py" "$GITHUB_WORKSPACE/tests/test_milestone_public_contract.py" "$GITHUB_WORKSPACE/tests/test_external_milestone_progress.py" "$GITHUB_WORKSPACE/tests/test_guided_bootstrap.py" "$GITHUB_WORKSPACE/tests/test_external_work.py"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_engineering_cycle_architecture_admission.py" "$GITHUB_WORKSPACE/tests/test_repository_review.py" "$GITHUB_WORKSPACE/tests/test_engineering_cycle_workflow.py" "$GITHUB_WORKSPACE/tests/test_engineering_cycle_exposure.py" "$GITHUB_WORKSPACE/tests/test_scoped_host_grounding.py" "$GITHUB_WORKSPACE/tests/test_external_packet_dependencies.py" "$GITHUB_WORKSPACE/tests/test_packet_work_plan_mcp.py" "$GITHUB_WORKSPACE/tests/test_impl_45_7_registry_recipe_cleanup.py"
          export FLOWER_HOME="$RUNNER_TEMP/bootstrap-no-profile"
          test ! -e "$FLOWER_HOME"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/flower-mcp" bootstrap > "$RUNNER_TEMP/flower-bootstrap.md"
          test ! -e "$FLOWER_HOME"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -c 'from pathlib import Path; from importlib.resources import files; import os; output = Path(os.environ["RUNNER_TEMP"]).joinpath("flower-bootstrap.md").read_bytes(); canonical = files("flow_of_work_mcp").joinpath("resources/agent-bootstrap.md").read_bytes(); assert output == canonical, "Bootstrap command differs from its bundled instructions"; assert all(marker in output for marker in (b"fow_interaction", b"fow_capabilities", b"fow_handover", b"<!-- flower-mcp:begin -->", b"<!-- flower-mcp:end -->")), "Bootstrap command omits essential instructions"'
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" "$GITHUB_WORKSPACE/tools/smoke_mcp.py" --command "$RUNNER_TEMP/flower-wheel/bin/flower-mcp" --output "$RUNNER_TEMP/flower-mcp-smoke.json"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" "$GITHUB_WORKSPACE/tools/smoke_client_registration.py" --python "$RUNNER_TEMP/flower-wheel/bin/python" --output "$RUNNER_TEMP/flower-google-client-smoke.json"
      - name: Check installed native purge guards and recovery / Linux POSIX only
        if: matrix.python == '3.11'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-wheel/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_native_project_purge.py"
      - name: Upgrade the published baseline while preserving public lifecycle state
        if: matrix.python == '3.11'
        run: python tools/smoke_upgrade.py --assets dist --root "$RUNNER_TEMP/flower-upgrade" --output "$RUNNER_TEMP/flower-upgrade-smoke.json"
      - name: Retain the Linux public upgrade receipts
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flower-linux-upgrade-qualification
          path: ${{ runner.temp }}/flower-upgrade-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install the candidate wheel extra from the public optional runtime release
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/flower-inference"
          flower_wheels=("$GITHUB_WORKSPACE"/dist/flow_of_work_mcp-*.whl)
          test "${#flower_wheels[@]}" -eq 1
          "$RUNNER_TEMP/flower-inference/bin/python" -m pip install "${flower_wheels[0]}[inference]"
          "$RUNNER_TEMP/flower-inference/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/flower-inference/bin/python" - <<'PY'
          import hashlib, json, sys
          from importlib.metadata import distribution
          from pathlib import Path
          import flow_of_work_mcp, runtime_llama
          runtime = distribution('runtime-llama')
          assert runtime.version == runtime_llama.__version__ == '0.5.0'
          assert Path(runtime_llama.__file__).is_relative_to(Path(sys.prefix))
          assert Path(flow_of_work_mcp.__file__).is_relative_to(Path(sys.prefix))
          assert 'lmstudio' not in sys.modules and 'openai' not in sys.modules
          direct = json.loads(runtime.read_text('direct_url.json'))
          assert direct['url'] == 'https://github.com/Damel91/llama-runtime/releases/download/v0.5.0/runtime_llama-0.5.0-py3-none-any.whl'
          assert direct['archive_info']['hashes']['sha256'] == 'dc7c2e056f55f68181dd82158417e5f53e0aed8189a07acf10e59314a80f6d13'
          assert runtime.metadata['License-Expression'] == 'Apache-2.0'
          attribution = {
              'LICENSE': 'cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30',
              'NOTICE': '4e061e20181823cf9700b8e894536a504a44e816bb732127c94379303cd12a43',
              'src/runtime_llama/_vendor/llamatelemetry.LICENSE': '708f3b49455b78ce7b71fa952e5a194ad6c48c818d586a2d922d6bbc511dcb66',
          }
          assert set(runtime.metadata.get_all('License-File')) == set(attribution)
          for relative, digest in attribution.items():
              members = [member for member in runtime.files if str(member).endswith('.dist-info/licenses/' + relative)]
              assert len(members) == 1
              path = Path(runtime.locate_file(members[0]))
              assert path.is_file() and path.is_relative_to(Path(sys.prefix))
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          print(json.dumps({'runtime': runtime.version, 'direct_url': direct, 'attribution_sha256': attribution}, indent=2))
          PY
          env -u PYTHONPATH "$RUNNER_TEMP/flower-inference/bin/flower-mcp" --help
          "$RUNNER_TEMP/flower-inference/bin/python" -m pip install 'pytest>=8,<10'
          env -u PYTHONPATH "$RUNNER_TEMP/flower-inference/bin/python" -m pytest -c /dev/null --rootdir "$RUNNER_TEMP" -p no:cacheprovider --noconftest "$GITHUB_WORKSPACE/tests/test_model_runtime_gateway.py"
      - name: Qualify Glama's uv core resolution and environment-aware stdio command
        if: matrix.python == '3.14'
        shell: bash
        run: |
          python -m pip install uv==0.12.23
          python -m unittest discover -s tests -p test_uv_smoke.py -v
          python tools/smoke_uv.py --source "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/flower-uv" --uv "$(command -v uv)" --python "$(command -v python)" --source-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/flower-uv-smoke.json"
      - name: Retain the uv core and restart receipts
        if: always() && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flower-uv-core-qualification
          path: |
            ${{ runner.temp }}/flower-uv-smoke.json
            ${{ runner.temp }}/flower-uv/commands.json
            ${{ runner.temp }}/flower-uv/source-manifest.json
            ${{ runner.temp }}/flower-uv/*.stdout
            ${{ runner.temp }}/flower-uv/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the release artifacts built on the minimum Python version
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flower-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  windows-installer:
    name: Windows PowerShell launcher checks and installed wheel
    needs: packages
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Parse and exercise the launcher helpers on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw 'This checkpoint requires Windows PowerShell 5.1.'
          }
          & .\tools\check_windows_installer.ps1
      - name: Fetch the current packages built on the minimum Python version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flower-packages
          path: dist
      - name: Exercise the current installed wheel without coding-client registration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $environment = Join-Path $env:RUNNER_TEMP 'flower-installer-venv'
          $profile = Join-Path $env:RUNNER_TEMP 'flower-installer-profile'
          $env:FLOWER_HOME = Join-Path $env:RUNNER_TEMP 'flower-installer-home'
          if ((Test-Path $environment) -or (Test-Path $profile) -or (Test-Path $env:FLOWER_HOME)) {
            throw 'The installer checkpoint requires fresh isolated paths.'
          }
          $wheel = @(Get-ChildItem -LiteralPath .\dist -Filter 'flow_of_work_mcp-*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one current Flower release wheel.' }
          python -m venv $environment
          if ($LASTEXITCODE -ne 0) { throw 'Isolated environment preparation failed.' }
          $python = Join-Path $environment 'Scripts\python.exe'
          & $python -m pip install $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Current wheel installation failed.' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed dependencies are inconsistent.' }
          & $python -m pip install 'pytest>=8,<10'
          if ($LASTEXITCODE -ne 0) { throw 'Installed upgrade-test runner preparation failed.' }
          if ((Test-Path $profile) -or (Test-Path $env:FLOWER_HOME)) {
            throw 'No-register installation created a lifecycle profile.'
          }
          $command = Join-Path $environment 'Scripts\flower-mcp.exe'
          $env:FLOWER_EXPECTED_VERSION = python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Release version lookup failed.' }
          $smoke = Join-Path $env:GITHUB_WORKSPACE 'tools\smoke_mcp.py'
          $probe = @'
          import os, subprocess, sys
          from importlib.metadata import version
          from importlib.resources import files
          from importlib.util import find_spec
          from pathlib import Path
          import flow_of_work_mcp
          assert Path(flow_of_work_mcp.__file__).is_relative_to(Path(sys.prefix))
          assert version('flow-of-work-mcp') == os.environ['FLOWER_EXPECTED_VERSION']
          assert find_spec('runtime_llama') is None and find_spec('lmstudio_agent_runtime') is None
          command = str(Path(sys.prefix) / 'Scripts' / 'flower-mcp.exe')
          output = subprocess.check_output([command, 'bootstrap']).decode('utf-8').replace('\r\n', '\n')
          assert output == files('flow_of_work_mcp').joinpath('resources/agent-bootstrap.md').read_text(encoding='utf-8')
          assert not Path(os.environ['FLOWER_HOME']).exists()
          '@
          $savedPythonPath = $env:PYTHONPATH
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $pytestConfig = Join-Path $env:RUNNER_TEMP 'flower-empty-pytest.ini'
          Set-Content -LiteralPath $pytestConfig -Value '[pytest]' -Encoding ASCII
          Push-Location $env:RUNNER_TEMP
          try {
            & $command --help
            if ($LASTEXITCODE -ne 0) { throw 'Installed Flower command failed.' }
            & $python -c $probe
            if ($LASTEXITCODE -ne 0) { throw 'Installed metadata or bootstrap failed.' }
            & $python $smoke --command $command --output (Join-Path $env:RUNNER_TEMP 'flower-windows-mcp-smoke.json')
            if ($LASTEXITCODE -ne 0) { throw 'Installed public MCP lifecycle smoke failed.' }
            & $python (Join-Path $env:GITHUB_WORKSPACE 'tools\smoke_client_registration.py') --python $python --output (Join-Path $env:RUNNER_TEMP 'flower-windows-google-client-smoke.json')
            if ($LASTEXITCODE -ne 0) { throw 'Installed Google registration and generated MCP smoke failed.' }
            & $python -m pytest -c $pytestConfig --rootdir $env:RUNNER_TEMP -p no:cacheprovider --noconftest (Join-Path $env:GITHUB_WORKSPACE 'tests\test_safe_upgrade.py')
            if ($LASTEXITCODE -ne 0) { throw 'Installed native Windows upgrade regressions failed.' }
            & $python -m pytest -c $pytestConfig --rootdir $env:RUNNER_TEMP -p no:cacheprovider --noconftest (Join-Path $env:GITHUB_WORKSPACE 'tests\test_tool_definitions.py')
            if ($LASTEXITCODE -ne 0) { throw 'Installed tool definition and input-compatibility regressions failed.' }
            & $python -m pytest -c $pytestConfig --rootdir $env:RUNNER_TEMP -p no:cacheprovider --noconftest (Join-Path $env:GITHUB_WORKSPACE 'tests\test_lens_operation_catalog.py')
            if ($LASTEXITCODE -ne 0) { throw 'Installed lens operation catalog regressions failed.' }
            & $python -m pytest -c $pytestConfig --rootdir $env:RUNNER_TEMP -p no:cacheprovider --noconftest (Join-Path $env:GITHUB_WORKSPACE 'tests\test_mcp_provider_deadline.py') (Join-Path $env:GITHUB_WORKSPACE 'tests\test_packet_provider_deadline.py') (Join-Path $env:GITHUB_WORKSPACE 'tests\test_mfpr_structured_provider.py')
            if ($LASTEXITCODE -ne 0) { throw 'Installed provider deadline and process-cleanup regression checks failed.' }
          }
          finally {
            Pop-Location
            if ($null -eq $savedPythonPath) { Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue }
            else { $env:PYTHONPATH = $savedPythonPath }
          }
          if ((Test-Path $profile) -or (Test-Path $env:FLOWER_HOME)) {
            throw 'Bootstrap created a lifecycle profile.'
          }
      - name: Check installed native prepare durability refusal / no Windows deletion acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:RUNNER_TEMP 'flower-installer-venv\Scripts\python.exe'
          $nativeGuard = @'
          from contextlib import closing
          from importlib.resources import files
          import json, os, sqlite3, subprocess, sys, tempfile
          from pathlib import Path
          from uuid import uuid4
          import yaml
          import flow_of_work_mcp
          from flow_of_work_mcp import SQLiteRequirementLedger
          assert os.name == 'nt', 'This checkpoint only checks native Windows refusal.'
          assert Path(flow_of_work_mcp.__file__).is_relative_to(Path(sys.prefix))
          def snapshot(database):
              with closing(sqlite3.connect(database.as_uri() + '?mode=ro', uri=True)) as connection:
                  connection.execute('BEGIN')
                  assert connection.execute('PRAGMA integrity_check').fetchall() == [('ok',)]
                  assert connection.execute('PRAGMA foreign_key_check').fetchall() == []
                  return '\n'.join(connection.iterdump())
          with tempfile.TemporaryDirectory(prefix='flower-native-windows-guard-', dir=os.environ['RUNNER_TEMP']) as directory:
              root = Path(directory).resolve()
              database = root / 'ledger.sqlite3'
              config = root / 'flower.yaml'
              # Synthetic owned fixture only; this is not a public-MCP purge qualification.
              ledger = SQLiteRequirementLedger(database)
              ledger.create_project('target', 'Owned native guard target', actor='ci-synthetic-fixture')
              ledger.create_project('sentinel', 'Owned retained project', actor='ci-synthetic-fixture')
              payload = yaml.safe_load(files('flow_of_work_mcp').joinpath('resources/standalone.yaml').read_text())
              payload['runtime'].update(database_path=str(database), import_root=str(root / 'imports'))
              payload['logging']['logs_path'] = str(root / 'logs')
              config.write_text(yaml.safe_dump(payload), encoding='utf-8')
              before, yaml_before = snapshot(database), config.read_bytes()
              result = subprocess.run([sys.executable, '-m', 'flow_of_work_mcp.cli', 'project-purge', 'prepare',
                  '--config', str(config), '--project-id', 'target', '--deletion-id', str(uuid4())],
                  cwd=root, text=True, encoding='utf-8', capture_output=True, timeout=30)
              assert result.returncode == 3, (result.returncode, result.stdout, result.stderr)
              assert result.stderr == '' and len(result.stdout.splitlines()) == 1
              response = json.loads(result.stdout)
              assert response['status'] == 'blocked'
              assert response['diagnostics'][0]['code'] == 'native_purge_durability_unavailable'
              assert response['project_effect_state'] == 'none' and response['journal_changed'] is False
              assert response['project_present'] is True
              assert snapshot(database) == before and config.read_bytes() == yaml_before
              assert not database.with_name(database.name + '.project-purge').exists()
              print(json.dumps({'status': 'passed', 'scope': 'Windows prepare-only durability refusal',
                  'deletion_executed': False, 'native_windows_deletion_qualified': False,
                  'diagnostic': response['diagnostics'][0]['code']}))
          '@
          $savedPythonPath = $env:PYTHONPATH
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          try {
            & $python -c $nativeGuard
            if ($LASTEXITCODE -ne 0) { throw 'Installed native Windows prepare-only durability guard failed.' }
          }
          finally {
            Pop-Location
            if ($null -eq $savedPythonPath) { Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue }
            else { $env:PYTHONPATH = $savedPythonPath }
          }
      - name: Upgrade the published baseline on Windows with its SQLite state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/smoke_upgrade.py --assets dist --root (Join-Path $env:RUNNER_TEMP 'flower-upgrade') --output (Join-Path $env:RUNNER_TEMP 'flower-upgrade-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'Published-baseline Windows upgrade failed.' }
      - name: Retain the Windows public upgrade receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flower-windows-upgrade-qualification
          path: ${{ runner.temp }}/flower-upgrade-smoke.json
          if-no-files-found: warn
          retention-days: 14
  container:
    name: Core container and durable public MCP / Linux amd64
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flower-packages
          path: dist
      - name: Prepare the public client and check qualifier failures
        run: |
          python -m pip install dist/flow_of_work_mcp-*.whl
          python -m unittest discover -s tests -p test_container_smoke.py -v
      - name: Validate maintainer metadata against Glama's published schema
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          from jsonschema import Draft7Validator
          manifest = json.loads(Path('glama.json').read_text())
          request = urllib.request.Request(manifest['$schema'], headers={
              'Accept': 'application/json', 'User-Agent': 'Flower-MCP-Qualification'})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = response.read(1024 * 1024 + 1)
              print('Glama schema response:', response.status, response.geturl(), response.headers.get('Content-Type'))
          Path('glama-schema-response.bin').write_bytes(payload)
          if len(payload) > 1024 * 1024:
              raise ValueError('Glama schema exceeds the qualification limit')
          schema = json.loads(payload)
          Draft7Validator.check_schema(schema)
          Draft7Validator(schema).validate(manifest)
          Path('glama-schema-checked.json').write_text(json.dumps(schema, indent=2) + '\n')
          PY
      - name: Build the actual image from the current source archive
        run: |
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          archives = list(Path('dist').glob('*.tar.gz'))
          assert len(archives) == 1
          destination = Path(os.environ['RUNNER_TEMP']) / 'flower-container-source'
          destination.mkdir()
          with tarfile.open(archives[0]) as archive:
              archive.extractall(destination, filter='data')
          sources = list(destination.iterdir())
          assert len(sources) == 1 and (sources[0] / 'Dockerfile').is_file()
          Path('container-build-source.txt').write_text(str(sources[0]))
          PY
          docker build --tag flower-mcp:qualification "$(cat container-build-source.txt)"
      - name: Exercise the network-disabled image through public MCP and recreate it
        run: python tools/smoke_container.py --engine docker --image flower-mcp:qualification --output flower-container-smoke.json
      - name: Retain the container and schema receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flower-container-qualification
          path: |
            flower-container-smoke.json
            glama-schema-checked.json
            glama-schema-response.bin
          if-no-files-found: warn
          retention-days: 14
